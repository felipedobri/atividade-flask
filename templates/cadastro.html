{% extends "base.html" %}
{% block title %}Cadastro{% endblock %}
{% block content %}
  <main class="container py-5 flex-grow-1">
    <div class="row justify-content-center">
      <div class="col-md-7">
        <h1 class="display-6 fw-bold text-light mb-4 text-center">Cadastro</h1>
        <form method="post" action="{{ url_for('cadastro') }}" class="bg-body-tertiary p-4 rounded border border-secondary shadow-sm">
          <div class="mb-3">
            <label for="nome" class="form-label text-info fw-bold">Nome</label>
            <input type="text" class="form-control bg-dark border-secondary text-light" id="nome" name="nome" maxlength="100" required>
          </div>
          <div class="mb-3">
            <label for="email" class="form-label text-info fw-bold">E-mail</label>
            <input type="email" class="form-control bg-dark border-secondary text-light" id="email" name="email" maxlength="150" required>
          </div>
          <div class="mb-4">
            <label for="mensagem" class="form-label text-info fw-bold">Mensagem</label>
            <textarea class="form-control bg-dark border-secondary text-light" id="mensagem" name="mensagem" rows="4"></textarea>
          </div>
          <button type="submit" class="btn btn-info w-100 fw-bold">Salvar</button>
        </form>
      </div>
    </div>
  </main>
{% endblock %}
